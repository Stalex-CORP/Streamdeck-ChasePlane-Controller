<!doctype html>
<html>
	<head lang="en">
		<title>Camera</title>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
		<script>
			SDPIComponents.i18n.locales = {
				en: {
					mode: "Mode",
					camera: "Camera",
					loading: "Loading views…",
					placeholder: "Select a view",
					connected: "ChasePlane connected",
					disconnected: "ChasePlane not connected",
				},
				fr: {
					mode: "Mode",
					camera: "Caméra",
					loading: "Chargement des vues…",
					placeholder: "Choisir une vue",
					connected: "ChasePlane connecté",
					disconnected: "ChasePlane non connecté",
				},
			};
		</script>
		<style>
			.status {
				display: flex;
				align-items: center;
				gap: 6px;
				min-height: 26px;
			}
			.status .dot {
				flex: none;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: #d13b3b;
			}
			.status.connected .dot {
				background: #2ea44f;
			}
		</style>
	</head>

	<body>
		<sdpi-item label="__MSG_mode__">
			<sdpi-radio setting="mode" value-type="number" default="0" columns="3" datasource="getModes"></sdpi-radio>
		</sdpi-item>

		<sdpi-item label="__MSG_camera__">
			<sdpi-select
				setting="guid"
				datasource="getCameras"
				loading="__MSG_loading__"
				placeholder="__MSG_placeholder__"
				hot-reload
				show-refresh
			></sdpi-select>
		</sdpi-item>

		<sdpi-item>
			<div id="status" class="status" hidden>
				<span class="dot"></span>
				<span id="status-text"></span>
			</div>
		</sdpi-item>

		<script>
			const { streamDeckClient, i18n } = SDPIComponents;
			const status = document.getElementById("status");
			const text = document.getElementById("status-text");

			streamDeckClient.sendToPropertyInspector.subscribe((message) => {
				const payload = message.payload;
				if (payload?.event !== "status") return;

				status.hidden = false;
				status.classList.toggle("connected", payload.connected === true);
				text.textContent = payload.connected
					? `${i18n.getMessage("connected")}${payload.aircraft ? ` (${payload.aircraft})` : ""}`
					: i18n.getMessage("disconnected");
			});
		</script>
	</body>
</html>
